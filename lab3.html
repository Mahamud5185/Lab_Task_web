 
<!DOCTYPE html>
<html>
<head>
    <title>Photo Gallery</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding: 20px;
        }

        .gallery img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
    </style>
</head>

<body>

    <h1>My Photo Gallery</h1>

    <div class="gallery">
        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=800" alt="Landscape">

        <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=800" alt="Mountain">

        <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=800" alt="Sunrise">

        <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=800" alt="Nature">

        <img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=800" alt="Ocean">

        <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?w=800" alt="Green Hills">
    </div>

</body>
</html>
